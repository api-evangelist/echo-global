openapi: 3.2.0
info:
  title: EchoSync Partner-Connect API (REST API V2) Ping API
  description: Formerly the Echo REST API. Provides load creation for Truckload, LTL, and Partial shipments, LTL freight rating, real-time shipment tracking, and document retrieval for existing Echo partners. All API access is over HTTPS. All data is sent and received as JSON. Authentication requires UserName and APIKey sent as request headers.
  version: 2.7.7-main
  contact:
    name: Echo Global Logistics
    url: https://www.echo.com
    email: info@echo.com
servers:
- url: https://restapi.echo.com
  description: Production server
tags:
- name: Ping
  description: GET to ping endpoints.
paths:
  /v2/ping:
    get:
      operationId: GetPingResponse
      summary: Provides confirmation of service availability and authentication
      description: Retrieve a ping to confirm service availability.
      tags:
      - Ping
      security:
      - basicAuth: []
      responses:
        '200':
          description: Service is available and authentication is valid
        '401':
          description: Unauthorized
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: UserName and APIKey encoded as Base64
