openapi: 3.2.0
info:
  title: EchoSync Partner-Connect API (REST API V2) Documents API
  description: Formerly the Echo REST API. Provides load creation for Truckload, LTL, and Partial shipments, LTL freight rating, real-time shipment tracking, and document retrieval for existing Echo partners. All API access is over HTTPS. All data is sent and received as JSON. Authentication requires UserName and APIKey sent as request headers.
  version: 2.7.7-main
  contact:
    name: Echo Global Logistics
    url: https://www.echo.com
    email: info@echo.com
servers:
- url: https://restapi.echo.com
  description: Production server
tags:
- name: Documents
  description: GET and POST to shipment documents endpoints.
paths:
  /v2/shipments/{Id}/documents:
    get:
      operationId: GetShipmentDocuments
      summary: Returns documents for a shipment
      description: Retrieve documents associated with a shipment.
      tags:
      - Documents
      security:
      - basicAuth: []
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Shipment documents
        '401':
          description: Unauthorized
        '404':
          description: Not found
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: UserName and APIKey encoded as Base64
